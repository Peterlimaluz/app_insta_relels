name: Agendador de Reels Automatico

on:
  schedule:
    - cron: '*/15 * * * *'  # Executa a cada 15 minutos em segundo plano
  workflow_dispatch:        # Permite disparar manualmente pelo botão no GitHub

permissions:
  contents: write           # Permissão para o bot salvar alterações no CSV

jobs:
  run-reels-publisher:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas requests; fi

      - name: Executar Runner de Postagem
        env:
          IG_ID: ${{ secrets.IG_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: python runner.py

      - name: Salvar e Enviar CSV Atualizado para o Repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add agendamento.csv || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Atualiza status de postagem no agendamento.csv" && git push)

name: Agendador de Reels Automatico

on:
  schedule:
    - cron: '*/15 * * * *'  # Executa a cada 15 minutos em segundo plano
  workflow_dispatch:        # Permite disparar manualmente pelo botão no GitHub

jobs:
  run-reels-publisher:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

